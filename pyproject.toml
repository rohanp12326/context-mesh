[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-mesh"
version = "0.1.0"
description = "Permission-aware agentic retrieval system for answering cross-tool organizational questions across Jira, Notion, and Gmail."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ContextMesh Contributors" }
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "mcp>=1.0.0",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
